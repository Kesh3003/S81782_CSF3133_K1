<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>General Knowledge Quiz</h1>
            <p>Let's test your knowledge.</p>
        </header>

        <main>
            <section class="quiz-card">

                <div class="quiz-info">
                    <span id="question-number">Question 1 of 7</span>
                    <span id="timer">Time: 15s</span>
                </div>

                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>

                <section id="question-section">
                    <h2 id="question">Click Start Quiz to begin.</h2>

                    <div id="answer-options" class="answer-options"></div>

                    <p id="feedback" role="status"></p>
                </section>

                <div class="buttons">
                    <button id="start-button">Start Quiz</button>
                    <button id="submit-button" disabled>Submit Answer</button>
                    <button id="next-button" disabled>Next Question</button>
                </div>

            </section>

            <footer id="result">
                Your score will appear here after you finish the quiz.
            </footer>
        </main>

    </div>

</body>

</html>
