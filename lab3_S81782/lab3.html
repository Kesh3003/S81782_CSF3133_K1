<!DOCTYPE html>
<html>
<head>
    <title>Get In Touch Portal</title>
</head>
<body>

    <div>
        <h1>Get In Touch Portal</h1>
        <span>Got questions? We've got answers.</span>
    </div>

    <hr>

    <div>
        <h2>Contact Form:</h2>

        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="date">Preferred Contact Date:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="satisfaction">Satisfaction Level:</label>
            <input type="range" id="satisfaction"
                   name="satisfaction" min="0" max="10">
            <br><br>

            <input type="submit" value="Submit">
        </form>

        <hr>

        <div>
            <h2>Calculator</h2>

            <label for="num1">First Number:</label>
            <input type="number" id="num1" oninput="calculateSum()">
            <br><br>

            <label for="num2">Second Number:</label>
            <input type="number" id="num2" oninput="calculateSum()">
            <br><br>

            <label>Sum:</label>
            <output id="result">0</output>
        </div>
    </div>

    <hr>

    <div>
        <h3>Contact Information</h3>
        <p>Email: getintouch@yahoo.com</p>
        <p>Helpline: 05-3456789</p>

        <p>&copy; 2026 Get In Touch Portal. All rights reserved.</p>
    </div>

    <script>
        function calculateSum() {
            let num1 = parseFloat(document.getElementById("num1").value) || 0;
            let num2 = parseFloat(document.getElementById("num2").value) || 0;

            let sum = num1 + num2;

            document.getElementById("result").value = sum;
        }
    </script>

</body>
</html>
