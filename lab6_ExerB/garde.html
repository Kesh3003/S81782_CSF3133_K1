<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <!-- Link external CSS stylesheet  -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Student Grade Calculator</h2>

    <!-- Form calls checkMark() and returns false to prevent page reload -->
    <form name="gradeForm" onsubmit="return checkMark()">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="mark">Mark (0-100):</label><br>
        <input type="text" id="mark" name="mark"><br><br>

        <button type="submit">Check Grade</button>
        <!-- Random Mark button -->
        <button type="button" onclick="generateRandomMark()">Random Mark</button>
    </form>

    <!-- Display grade result and check timestamp -->
    <p id="result"></p>
    <p id="timestamp"></p>

    <!-- Button and container for grade table -->
    <button type="button" onclick="showTable()">Show Grade Table</button>
    <div id="tableContainer"></div>

    <!-- Fixed script filename from grades.js to grade.js -->
    <script src="grade.js"></script>
</body>

</html>
